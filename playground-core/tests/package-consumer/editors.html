<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Embedded editor contract</title>
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
      }
      .editors {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .host {
        height: 640px;
        min-width: 0;
      }
      @media (max-width: 700px) {
        .editors {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <input aria-label="Host input" />
    <div class="editors">
      <div id="first" class="host"></div>
      <div id="second" class="host"></div>
    </div>
    <script type="module" src="./editors.ts"></script>
  </body>
</html>
